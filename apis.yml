aid: adaptx
name: AdaptX
description: >-
  AdaptX is a Seattle-based clinical performance management company (founded 2016 as MDMetrix,
  renamed AdaptX in 2021) whose self-serve platform reads a hospital's existing electronic medical
  record data and turns it into near-real-time analytics that clinical, quality, operational and
  finance leaders use to measure and reduce clinical variation. Customers include Seattle Children's,
  Memorial Hermann, Children's Minnesota, USA Health and Kittitas Valley Healthcare, with published
  case studies covering surgical capacity, emergency department time-to-triage, length of stay,
  anesthetic greenhouse-gas reduction and health-equity stratification. The product is delivered as a
  hosted SaaS application on AWS to contracted health systems; as of this profiling pass AdaptX
  publishes no public developer portal, API reference, or machine-readable API description.
